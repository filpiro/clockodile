<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crocodile sprite preview</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 16px; background: #e8edf0; font: 16px system-ui; }
  form { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  canvas { max-width: 100%; height: auto; margin: auto; }
</style>
<form>
  <label>Name <select id="name"></select></label>
  <label id="versionLabel">Version <select id="version"></select></label>
  <label id="directionLabel">Direction <select id="direction"></select></label>
</form>
<canvas width="320" height="320" role="img" aria-label="Animated crocodile sprite"></canvas>
<script>
const sheets = [["Attack", 1, "L", "Attack1_L.png"], ["Attack", 1, "R", "Attack1_R.png"], ["Attack", 2, "L", "Attack2_L.png"], ["Attack", 2, "R", "Attack2_R.png"], ["Attack", 3, "L", "Attack3_L.png"], ["Attack", 3, "R", "Attack3_R.png"], ["Attack", 4, "L", "Attack4_L.png"], ["Attack", 4, "R", "Attack4_R.png"], ["Attack", 5, "L", "Attack5_L.png"], ["Attack", 5, "R", "Attack5_R.png"], ["Attack inJump", 6, "L", "Attack6_inJump_L.png"], ["Attack inJump", 6, "R", "Attack6_inJump_R.png"], ["Attack", 7, "L", "Attack7_L.png"], ["Attack", 7, "R", "Attack7_R.png"], ["Attack", 8, "L", "Attack8_L.png"], ["Attack", 8, "R", "Attack8_R.png"], ["Attack Combo", 1, "L", "Attack_Combo_L.png"], ["Attack Combo", 1, "R", "Attack_Combo_R.png"], ["Death", 1, "L", "Death1_L.png"], ["Death", 1, "R", "Death1_R.png"], ["Death", 2, "L", "Death2_L.png"], ["Death", 2, "R", "Death2_R.png"], ["Death", 3, "L", "Death3_L.png"], ["Death", 3, "R", "Death3_R.png"], ["Death", 4, "L", "Death4_L.png"], ["Death", 4, "R", "Death4_R.png"], ["Hit", 1, "L", "Hit1_L.png"], ["Hit", 1, "R", "Hit1_R.png"], ["Hit", 2, "L", "Hit2_L.png"], ["Hit", 2, "R", "Hit2_R.png"], ["Idle", 1, "L", "Idle1_L.png"], ["Idle", 1, "R", "Idle1_R.png"], ["Idle", 2, "L", "Idle2_L.png"], ["Idle", 2, "R", "Idle2_R.png"], ["Jump", 1, "L", "Jump_L.png"], ["Jump", 1, "R", "Jump_R.png"], ["Run Backpedal", 1, "L", "Run_Backpedal_L.png"], ["Run Backpedal", 1, "R", "Run_Backpedal_R.png"], ["Run Forward", 1, "L", "Run_Forward_L.png"], ["Run Forward", 1, "R", "Run_Forward_R.png"], ["Swim", 1, "L", "Swim_L.png"], ["Swim", 1, "R", "Swim_R.png"], ["Walk Backpedal", 1, "L", "Walk_Backpedal_L.png"], ["Walk Backpedal", 1, "R", "Walk_Backpedal_R.png"], ["Walk Forward", 1, "L", "Walk_Forward_L.png"], ["Walk Forward", 1, "R", "Walk_Forward_R.png"]];
const nameSelect = document.querySelector('#name');
const versionSelect = document.querySelector('#version');
const directionSelect = document.querySelector('#direction');
const canvas = document.querySelector('canvas');
const context = canvas.getContext('2d');
let image, frame = 0, columns = 8, count = 8;
let frameWidth = 320, frameTop = 0;
let timer, relaxed = false;
// Measured cutouts: the generated v3 sheet has uneven row spacing.
const relaxedFrames = [[30,99,230,212],[310,98,231,213],[587,98,234,213],[868,98,233,213],[27,354,234,221],[309,355,235,220],[590,354,232,221],[869,355,233,218],[28,612,231,223],[311,613,233,222],[587,613,230,224],[869,613,236,224],[29,871,235,223],[310,874,232,221],[587,875,232,220],[869,875,234,220],[27,1138,236,221],[307,1137,235,222],[587,1140,234,222],[868,1139,234,221]];

function options(select, values) {
  const previous = select.value;
  select.replaceChildren(...values.map(value => new Option(value, value)));
  if (values.map(String).includes(previous)) select.value = previous;
}
function selectedSheets() {
  return sheets.filter(sheet => sheet[0] === nameSelect.value);
}
function load() {
  clearInterval(timer);
  relaxed = nameSelect.value === 'Crocodile v3';
  const custom = nameSelect.value.startsWith('Crocodile');
  const revised = nameSelect.value === 'Crocodile v2';
  const sheet = selectedSheets().find(sheet => sheet[1] === Number(versionSelect.value) && sheet[2] === directionSelect.value);
  const next = new Image();
  image = next;
  frame = 0;
  canvas.width = custom ? 320 : 600;
  next.onload = () => {
    if (image !== next) return;
    frameWidth = revised ? next.width / 8 : canvas.width;
    frameTop = revised ? (next.height - frameWidth) / 2 : 0;
    columns = next.width / frameWidth;
    count = relaxed ? relaxedFrames.length : revised ? 8 : columns * (next.height / 320);
    draw();
    timer = setInterval(draw, relaxed ? 140 : 100);
  };
  next.onerror = () => { canvas.setAttribute('aria-label', 'Unable to load sprite'); };
  canvas.setAttribute('aria-label', nameSelect.value + ' animation');
  next.src = relaxed ? 'crocodile_walk-v3.png' : revised ? 'crocodile_walk-v2.png' : custom ? 'crocodile_walk.webp' : '../x320_Spritesheets/' + sheet[3];
}
function directions() {
  options(directionSelect, [...new Set(selectedSheets().filter(sheet => sheet[1] === Number(versionSelect.value)).map(sheet => sheet[2]))]);
  load();
}
function names() {
  const custom = nameSelect.value.startsWith('Crocodile');
  document.querySelector('#versionLabel').hidden = custom;
  document.querySelector('#directionLabel').hidden = custom;
  options(versionSelect, [...new Set(selectedSheets().map(sheet => sheet[1]))].sort((a, b) => a - b));
  directions();
}
function draw() {
  if (!image.complete || !image.naturalWidth) return;
  context.clearRect(0, 0, canvas.width, canvas.height);
  if (relaxed) {
    const [x, y, width, height] = relaxedFrames[frame];
    context.drawImage(image, x, y, width, height, (320 - width * 1.1) / 2, 280 - height * 1.1, width * 1.1, height * 1.1);
  } else {
    context.drawImage(image, (frame % columns) * frameWidth, frameTop + Math.floor(frame / columns) * 320, frameWidth, frameTop ? frameWidth : 320, 0, 0, canvas.width, 320);
  }
  frame = (frame + 1) % count;
}
options(nameSelect, ['Crocodile v3', 'Crocodile', 'Crocodile v2', ...new Set(sheets.map(sheet => sheet[0]))]);
nameSelect.onchange = names;
versionSelect.onchange = directions;
directionSelect.onchange = load;
names();
</script>
</html>
